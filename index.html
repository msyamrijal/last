<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Pemakalah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Jadwal Pemakalah</h1>
            <p>Sistem Informasi Jadwal Presentasi dan Seminar</p>
            <a href="#" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#adminLoginModal">Admin Login</a>
        </div>

        <div class="filter-section">
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="date" class="form-control" id="dateFilter">
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="institutionFilter">
                        <option value="">Semua Institusi</option>
                        <option>PTIQ</option>
                        <option>PKU B</option>
                        <option>PKUP</option>
                    </select>
                </div>
            </div>
        </div>

        <table class="table table-bordered table-hover">
            <thead class="table-light">
                <tr>
                    <th>Tanggal</th>
                    <th>Mata Kuliah</th>
                    <th>Pemakalah</th>
                    <th>Institusi</th>
                    <th>Kategori</th>
                </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>

        <div id="adminPanel" class="admin-panel">
            <h2>Admin Panel</h2>
            
            <div class="card mb-4">
                <div class="card-header">Tambah Jadwal Baru</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <select class="form-select" id="institution">
                                <option value="PTIQ">PTIQ</option>
                                <option value="PKU B">PKU B</option>
                                <option value="PKUP">PKUP</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <input type="text" class="form-control" id="course" placeholder="Mata Kuliah">
                        </div>
                        <div class="col-md-2">
                            <input type="date" class="form-control" id="date">
                        </div>
                        <div class="col-md-3">
                            <input type="text" class="form-control" id="speakers" placeholder="Pemakalah (pisahkan dengan koma)">
                        </div>
                        <div class="col-md-1">
                            <button class="btn btn-success" onclick="addSchedule()">Tambah</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Kelola Jadwal Existing</div>
                <div class="card-body">
                    <div id="scheduleList"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="adminLoginModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Admin Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="adminUsername" class="form-label">Username</label>
                        <input type="text" class="form-control" id="adminUsername">
                    </div>
                    <div class="mb-3">
                        <label for="adminPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="adminPassword">
                    </div>
                    <button class="btn btn-primary" onclick="adminLogin()">Login</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
